<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer - AskHere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Connects to Firebase -->
    <script src="config.js"></script>
    <style>
        body { background-color: #f4f7f6; padding-top: 80px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html"><i class="fas fa-arrow-left me-2"></i> Back to Feed</a>
            <div class="ms-auto">
                <a class="btn btn-primary text-white fw-bold px-4 rounded-pill shadow-sm" id="navLoginBtn" href="login.html">Login</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <!-- The Main Question Data -->
                <div id="questionData" class="mb-4 bg-white p-4 rounded shadow-sm border-top border-4 border-primary">
                    <p class="text-center text-muted"><i class="fas fa-spinner fa-spin"></i> Loading question...</p>
                </div>

                <!-- Write Answer Section -->
                <div class="card mb-5 p-4 bg-light shadow-sm border-0">
                    <h5 class="fw-bold mb-3">Write your answer...</h5>
                    <textarea id="answerInput" class="form-control border-0 mb-3" rows="4" placeholder="Share your knowledge..."></textarea>
                    <div class="text-end">
                        <button class="btn btn-primary fw-bold rounded-pill px-5 shadow-sm" onclick="postAnswer()">Post Answer</button>
                    </div>
                </div>

                <!-- Responses Section -->
                <h4 class="fw-bold border-start border-4 border-success ps-3 mb-4">Answers</h4>
                <div id="answersContainer">
                    <p class="text-muted">No answers yet. Be the first!</p>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Grab the ID from the URL link
        const urlParams = new URLSearchParams(window.location.search);
        const qId = urlParams.get('id');

        setTimeout(() => {
            if(!qId) {
                document.getElementById('questionData').innerHTML = "<h3 class='text-danger'>Question not found!</h3>";
                return;
            }

            // Read the specific question
            db.collection("questions").doc(qId).get().then(doc => {
                if(doc.exists) {
                    const q = doc.data();
                    document.getElementById('questionData').innerHTML = `
                        <h2 class="fw-bold">${q.title}</h2>
                        <p class="fs-5 text-secondary mt-3">${q.desc}</p>
                        <small class="text-muted mt-4 d-block"><i class="fas fa-user-circle"></i> Asked by ${q.authorEmail}</small>
                    `;
                }
            });

            // Read all answers for this specific question live
            db.collection("questions").doc(qId).collection("answers").orderBy("timestamp", "asc").onSnapshot(snapshot => {
                const container = document.getElementById('answersContainer');
                if(!snapshot.empty) container.innerHTML = ''; // Clear default text
                
                snapshot.forEach(doc => {
                    const ans = doc.data();
                    container.innerHTML += `
                        <div class="card p-4 mb-4 shadow-sm border-0">
                            <small class="text-primary fw-bold mb-2"><i class="fas fa-check-circle"></i> ${ans.authorEmail}</small>
                            <div class="fs-5 text-dark">${ans.text}</div>
                        </div>
                    `;
                });
            });
        }, 1000);

        function postAnswer() {
            if (!auth.currentUser) {
                alert("You must login to post an answer!");
                window.location.href = "login.html";
                return;
            }
            if(!qId) return;

            const text = document.getElementById('answerInput').value;
            if(!text.trim()) return;

            // Save answer inside the question's sub-folder
            db.collection("questions").doc(qId).collection("answers").add({
                text: text,
                authorEmail: auth.currentUser.email,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById('answerInput').value = ''; // clear input
            });
        }
    </script>
</body>
</html>
