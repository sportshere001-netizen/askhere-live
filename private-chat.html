<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Inbox - AskHere</title>
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="config.js"></script>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
        function toggleTheme() {
            const html = document.documentElement;
            const next = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', next); localStorage.setItem('theme', next);
        }
    </script>
    <style>
        body { background-color: var(--bs-body-bg); padding-top: 60px; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;}
        .layout-container { flex-grow: 1; display: flex; background: var(--bs-body-bg); margin: 10px auto; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 1200px; width: 100%; overflow: hidden; border: 1px solid var(--bs-border-color);}
        .sidebar { width: 350px; background: var(--bs-tertiary-bg); border-right: 1px solid var(--bs-border-color); display: flex; flex-direction: column;}
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; background: var(--bs-secondary-bg); }
        .list-group-item { cursor: pointer; transition: 0.2s; border: none; border-bottom: 1px solid var(--bs-border-color); padding: 20px; background: transparent; color: var(--bs-body-color);}
        .list-group-item:hover { background-color: rgba(13, 110, 253, 0.1); }
        .list-group-item.active { background-color: rgba(13, 110, 253, 0.15); color: var(--bs-body-color); border-left: 4px solid #0d6efd; }
        .messages { flex-grow: 1; padding: 30px; overflow-y: auto; }
        .message { margin-bottom: 20px; display: flex; }
        .message-content { background: var(--bs-body-bg); color: var(--bs-body-color); padding: 12px 18px; border-radius: 20px; max-width: 85%; box-shadow: 0 2px 5px rgba(0,0,0,0.02); border: 1px solid var(--bs-border-color); }
        .message.self { justify-content: flex-end; }
        .message.self .message-content { background: #0d6efd; color: white; border: none; }
        .chat-input-area { padding: 15px; background: var(--bs-body-bg); border-top: 1px solid var(--bs-border-color); display: flex; align-items: center; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold fs-4" href="index.html"><i class="fas fa-brain text-info"></i> AskHere</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-2">
                    <li class="nav-item"><a class="nav-link fw-semibold" href="index.html"><i class="fas fa-home"></i> Feed</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="chat.html"><i class="fas fa-globe text-info"></i> Global Chat</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="confessions.html"><i class="fas fa-user-secret text-secondary"></i> Confessions</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold text-white" href="private-chat.html"><i class="fas fa-envelope text-warning"></i> Inbox</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="about.html"><i class="fas fa-info-circle text-light"></i> Guide</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-outline-light rounded-circle" onclick="toggleTheme()"><i class="fas fa-adjust"></i></button>
                    <a class="btn btn-primary text-white fw-bold px-4 rounded-pill shadow-sm" id="navLoginBtn" href="login.html">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="layout-container">
        <div class="sidebar d-none d-md-flex">
            <div class="p-4 border-bottom bg-secondary-subtle">
                <h5 class="fw-bold mb-3">Send Request</h5>
                <div class="input-group shadow-sm">
                    <input type="email" id="requestEmailInput" class="form-control bg-body border-0" placeholder="User's Email..." onkeypress="if(event.key === 'Enter') sendRequest()">
                    <button class="btn btn-primary fw-bold" onclick="sendRequest()">Send</button>
                </div>
            </div>
            <ul class="nav nav-tabs nav-fill bg-secondary-subtle" id="inboxTabs" role="tablist">
                <li class="nav-item"><button class="nav-link active fw-bold py-3 text-body" data-bs-toggle="tab" data-bs-target="#activeChats">Chats</button></li>
                <li class="nav-item"><button class="nav-link fw-bold py-3 text-body" data-bs-toggle="tab" data-bs-target="#pendingRequests">Requests <span id="reqBadge" class="badge bg-danger ms-1 d-none">!</span></button></li>
            </ul>
            <div class="tab-content flex-grow-1 overflow-auto bg-body">
                <div class="tab-pane fade show active" id="activeChats"><div class="list-group list-group-flush" id="chatsList"><div class="p-4 text-center text-muted">Loading...</div></div></div>
                <div class="tab-pane fade" id="pendingRequests"><div class="list-group list-group-flush" id="requestsList"><div class="p-4 text-center text-muted">No requests.</div></div></div>
            </div>
        </div>

        <div class="chat-area">
            <div class="bg-body p-3 border-bottom shadow-sm">
                <h5 class="mb-0 fw-bold" id="chatHeader">Select a conversation</h5>
            </div>
            <div class="messages" id="privateMessages">
                <div class="text-center text-muted mt-5"><i class="fas fa-comments fa-3x mb-3 opacity-50"></i><p>Select a user to chat securely.</p></div>
            </div>
            <div class="chat-input-area">
                <button class="btn btn-light rounded-circle me-2 border p-2 shadow-sm" onclick="attachPrivateMedia()" id="mediaBtn" disabled><i class="fas fa-paperclip text-success"></i></button>
                <input type="text" id="privateInput" class="form-control rounded-pill border-0 bg-secondary-subtle px-4 shadow-sm" placeholder="Type a secure message..." onkeypress="if(event.key === 'Enter') sendPrivateMessage()" disabled>
                <button class="btn btn-primary rounded-circle ms-2 p-2 shadow" id="sendBtn" onclick="sendPrivateMessage()" disabled><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentChatUser = null;
        let myEmail = null;
        let unsubscribeMessages = null;
        let lastPrivateMsgTime = 0;

        setTimeout(() => {
            if(!auth.currentUser) { alert("Requires an account."); window.location.href = "login.html"; return; }
            myEmail = auth.currentUser.email;

            const reqTo = new URLSearchParams(window.location.search).get('requestTo');
            if(reqTo && reqTo !== myEmail) { document.getElementById('requestEmailInput').value = reqTo; }
            listenToRequests(); listenToActiveChats();
        }, 1500);

        function formatMedia(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                if (url.match(/\.(jpeg|jpg|gif|png)$/i)) return `<br><img src="${url}" class="img-fluid rounded mt-2 shadow-sm" style="max-height: 200px;">`;
                if (url.match(/\.(mp4|webm)$/i)) return `<br><video controls class="w-100 rounded mt-2 shadow-sm" style="max-height: 200px;"><source src="${url}"></video>`;
                if (url.match(/\.(mp3|wav)$/i)) return `<br><audio controls class="w-100 mt-2"><source src="${url}"></audio>`;
                if (url.includes('youtube.com') || url.includes('youtu.be')) {
                    let vidId = url.split('v=')[1] || url.split('/').pop();
                    if(vidId.includes('&')) vidId = vidId.split('&')[0];
                    return `<br><iframe class="w-100 rounded mt-2 shadow-sm" height="200" src="https://www.youtube.com/embed/${vidId}" frameborder="0" allowfullscreen></iframe>`;
                }
                return `<a href="${url}" target="_blank" class="text-decoration-underline">${url}</a>`;
            });
        }

        function attachPrivateMedia() {
            const link = prompt("Paste Media URL (Image, YouTube, Video, Audio):");
            if(link) { document.getElementById('privateInput').value += " " + link; document.getElementById('privateInput').focus(); }
        }

        function sendRequest() {
            const target = document.getElementById('requestEmailInput').value.trim();
            if(!target || target === myEmail) return;
            db.collection("chat_requests").add({ from: myEmail, to: target, status: 'pending', timestamp: firebase.firestore.FieldValue.serverTimestamp() })
              .then(() => { alert("Request sent!"); document.getElementById('requestEmailInput').value = ''; }).catch(handleFirebaseError);
        }

        function listenToRequests() {
            db.collection("chat_requests").where("to", "==", myEmail).where("status", "==", "pending").onSnapshot(snapshot => {
                  const list = document.getElementById('requestsList'); const badge = document.getElementById('reqBadge'); list.innerHTML = '';
                  if(snapshot.empty) { badge.classList.add('d-none'); list.innerHTML = '<div class="p-4 text-center text-muted">No pending requests.</div>'; return; }
                  badge.classList.remove('d-none');
                  snapshot.forEach(doc => {
                      const data = doc.data();
                      list.innerHTML += `<div class="list-group-item d-flex justify-content-between align-items-center"><div><small class="fw-bold d-block">${escapeHTML(data.from)}</small></div><button class="btn btn-success btn-sm rounded-pill" onclick="acceptRequest('${doc.id}', '${escapeHTML(data.from)}')">Accept</button></div>`;
                  });
              }, handleFirebaseError);
        }

        function acceptRequest(docId, fromUser) {
            db.collection("chat_requests").doc(docId).update({ status: 'accepted' }).then(() => {
                db.collection("active_chats").add({ users: [myEmail, fromUser] }); alert("Accepted!");
            }).catch(handleFirebaseError);
        }

        function listenToActiveChats() {
            db.collection("active_chats").where("users", "array-contains", myEmail).onSnapshot(snapshot => {
                  const list = document.getElementById('chatsList'); list.innerHTML = '';
                  if(snapshot.empty) { list.innerHTML = '<div class="p-4 text-center text-muted">No active chats.</div>'; return; }
                  snapshot.forEach(doc => {
                      const users = doc.data().users; const otherUser = users[0] === myEmail ? users[1] : users[0]; const roomId = users.sort().join('_'); 
                      list.innerHTML += `<div class="list-group-item" onclick="openChat('${roomId}', '${escapeHTML(otherUser)}')"><div class="d-flex align-items-center"><div class="bg-primary rounded-circle text-white d-flex align-items-center justify-content-center me-3 shadow-sm" style="width:40px; height:40px;"><i class="fas fa-user"></i></div><div><h6 class="mb-0 fw-bold">${escapeHTML(otherUser)}</h6></div></div></div>`;
                  });
              }, handleFirebaseError);
        }

        function openChat(roomId, otherUser) {
            currentChatUser = roomId;
            document.getElementById('chatHeader').innerHTML = `<i class="fas fa-lock text-success me-2"></i> Secure Chat with <strong>${otherUser}</strong>`;
            document.getElementById('privateInput').disabled = false; document.getElementById('sendBtn').disabled = false; document.getElementById('mediaBtn').disabled = false;

            if(unsubscribeMessages) unsubscribeMessages(); 
            unsubscribeMessages = db.collection("private_messages").doc(roomId).collection("messages").orderBy("timestamp", "asc").limitToLast(50).onSnapshot(snapshot => {
                  const box = document.getElementById('privateMessages'); box.innerHTML = '';
                  snapshot.forEach(doc => {
                      const msg = doc.data(); const isMe = msg.sender === myEmail;
                      box.innerHTML += `<div class="message ${isMe ? 'self' : ''}"><div class="message-content">${formatMedia(escapeHTML(msg.text))}</div></div>`;
                  });
                  box.scrollTop = box.scrollHeight;
              }, handleFirebaseError);
        }

        function sendPrivateMessage() {
            if(!currentChatUser) return;
            if (Date.now() - lastPrivateMsgTime < 3000) { alert("Spam protection. Please wait."); return; }
            const input = document.getElementById('privateInput'); const txt = input.value.trim(); if(!txt) return;

            lastPrivateMsgTime = Date.now();
            db.collection("private_messages").doc(currentChatUser).collection("messages").add({
                text: txt, sender: myEmail, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => { input.value = ''; input.focus(); }).catch(handleFirebaseError);
        }
    </script>
</body>
</html>
