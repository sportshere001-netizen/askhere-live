<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Confessions - AskHere</title>
    <!-- Browser Tab Icon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="config.js"></script>
    <style>
        body { background-color: #121212; color: #fff; padding-top: 80px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .confession-card { border: none; border-radius: 15px; background: #1e1e1e; transition: transform 0.2s; border-left: 5px solid #6c757d; }
        .confession-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255,255,255,0.05); }
        .input-dark { background: #2d2d2d; color: white; border: 1px solid #444; }
        .input-dark:focus { background: #3d3d3d; color: white; border-color: #0d6efd; box-shadow: none; }
    </style>
</head>
<body>

    <!-- Unified Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold fs-4" href="index.html"><i class="fas fa-brain text-info"></i> AskHere</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-2">
                    <li class="nav-item"><a class="nav-link fw-semibold" href="index.html"><i class="fas fa-home"></i> Feed</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="chat.html"><i class="fas fa-globe text-info"></i> Global Chat</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold text-white" href="confessions.html"><i class="fas fa-user-secret text-secondary"></i> Confessions</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="private-chat.html"><i class="fas fa-envelope text-warning"></i> Inbox</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="about.html"><i class="fas fa-info-circle text-light"></i> Guide</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <a class="btn btn-primary text-white fw-bold px-4 rounded-pill shadow-sm" id="navLoginBtn" href="login.html">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center mb-5">
                <i class="fas fa-user-secret fa-4x text-secondary mb-3"></i>
                <h1 class="fw-bold display-5">Anonymous Confessions</h1>
                <p class="fs-5 text-white-50">Speak your mind. Zero tracking. Zero judgment. 100% Anonymous.</p>
            </div>

            <div class="col-lg-6 mb-5">
                <div class="card bg-dark border-secondary p-4 shadow-lg" style="border-radius: 20px;">
                    <textarea id="confessInput" class="form-control form-control-lg input-dark mb-3 rounded-4" rows="4" placeholder="I have a confession to make..." onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); submitConfession(); }"></textarea>
                    <div class="text-end">
                        <small class="text-muted float-start mt-2">Press 'Enter' to send</small>
                        <button class="btn btn-light fw-bold rounded-pill px-4 shadow" onclick="submitConfession()"><i class="fas fa-paper-plane me-1"></i> Release</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4" id="confessionBoard">
            <div class="text-center text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Loading secrets...</p></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Array of random border colors for visual flair
        const colors = ['#0d6efd', '#198754', '#dc3545', '#ffc107', '#0dcaf0', '#6f42c1'];

        setTimeout(() => {
            db.collection("confessions").orderBy("timestamp", "desc").onSnapshot(snapshot => {
                const board = document.getElementById('confessionBoard');
                if (snapshot.empty) {
                    board.innerHTML = '<div class="text-center text-muted w-100 py-5">The board is completely empty.</div>';
                    return;
                }
                
                board.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const bColor = data.color || '#6c757d';
                    
                    board.innerHTML += `
                        <div class="col-md-6 col-lg-4">
                            <div class="card confession-card p-4 h-100" style="border-left-color: ${bColor};">
                                <p class="fs-5 mb-0" style="line-height: 1.6;">"${data.text}"</p>
                                <div class="mt-3 text-end"><small class="text-white-50"><i class="fas fa-mask"></i> Someone, somewhere</small></div>
                            </div>
                        </div>
                    `;
                });
            });
        }, 1000);

        function submitConfession() {
            const input = document.getElementById('confessInput');
            const txt = input.value.trim();
            if(!txt) return;

            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            db.collection("confessions").add({
                text: txt,
                color: randomColor,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                input.value = '';
            });
        }
    </script>
</body>
</html>
