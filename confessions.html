<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confessions - AskHere</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="config.js"></script>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark'; // Default dark for this page
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
        function toggleTheme() {
            const html = document.documentElement;
            const next = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', next); localStorage.setItem('theme', next);
        }
    </script>
    <style>
        body { padding-top: 80px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bs-body-bg); }
        .confession-card { border: none; border-radius: 15px; transition: transform 0.2s; background-size: cover; background-position: center; position: relative; overflow: hidden; min-height: 250px; display: flex; flex-direction: column; justify-content: center;}
        .confession-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        /* Dark Gradient Overlay guarantees white text is always readable */
        .card-overlay { position: absolute; top:0; left:0; right:0; bottom:0; background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.8)); z-index: 1; }
        .card-content { position: relative; z-index: 2; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold fs-4" href="index.html"><i class="fas fa-brain text-info"></i> AskHere</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-2">
                    <li class="nav-item"><a class="nav-link fw-semibold" href="index.html"><i class="fas fa-home"></i> Feed</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="chat.html"><i class="fas fa-globe text-info"></i> Global Chat</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold text-white" href="confessions.html"><i class="fas fa-user-secret text-secondary"></i> Confessions</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="private-chat.html"><i class="fas fa-envelope text-warning"></i> Inbox</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="about.html"><i class="fas fa-info-circle text-light"></i> Guide</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-outline-light rounded-circle" onclick="toggleTheme()"><i class="fas fa-adjust"></i></button>
                    <a class="btn btn-primary text-white fw-bold px-4 rounded-pill shadow-sm" id="navLoginBtn" href="login.html">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center mb-5">
                <i class="fas fa-user-secret fa-4x text-secondary mb-3"></i>
                <h1 class="fw-bold display-5">Anonymous Board</h1>
                <p class="fs-5 text-muted">Speak your mind. Zero tracking. Zero judgment. 100% Anonymous.</p>
            </div>

            <div class="col-lg-6 mb-5">
                <div class="card bg-secondary-subtle border-0 p-4 shadow-lg" style="border-radius: 20px;">
                    <textarea id="confessInput" class="form-control form-control-lg border-0 mb-3 shadow-sm rounded-4" rows="4" placeholder="I have a confession to make... (Press Enter to post)" onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); submitConfession(); }"></textarea>
                    <div class="text-end">
                        <button class="btn btn-dark fw-bold rounded-pill px-5 shadow" onclick="submitConfession()"><i class="fas fa-paper-plane me-2"></i> Release</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4" id="confessionBoard">
            <div class="text-center text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Loading secrets...</p></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        setTimeout(() => {
            db.collection("confessions").orderBy("timestamp", "desc").onSnapshot(snapshot => {
                const board = document.getElementById('confessionBoard');
                if (snapshot.empty) { board.innerHTML = '<div class="text-center text-muted w-100 py-5">The board is empty. Be the first.</div>'; return; }
                
                board.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Use open source abstract images for backgrounds
                    const bgImage = `https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80&sig=${data.imgId || 1}`;
                    
                    board.innerHTML += `
                        <div class="col-md-6 col-lg-4">
                            <div class="card confession-card p-4 shadow" style="background-image: url('${bgImage}');">
                                <div class="card-overlay"></div>
                                <div class="card-content text-center">
                                    <i class="fas fa-quote-left fa-2x mb-3 opacity-50"></i>
                                    <p class="fs-5 mb-0 fw-semibold">"${data.text}"</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
        }, 1000);

        function submitConfession() {
            const input = document.getElementById('confessInput');
            const txt = input.value.trim();
            if(!txt) return;

            db.collection("confessions").add({
                text: txt,
                imgId: Math.floor(Math.random() * 100), // Random image signature
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => input.value = '');
        }
    </script>
</body>
</html>
