<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AskHere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- This links your database brain to this page -->
    <script src="config.js"></script>
    <style>
        body { background-color: #f4f7f6; }
        .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { border-radius: 20px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1); max-width: 900px; width: 100%; }
        .login-image { background: url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80') center center no-repeat; background-size: cover; position: relative; }
        .login-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 110, 253, 0.85); display: flex; flex-direction: column; justify-content: center; padding: 40px; color: white; }
        .cursor-pointer { cursor: pointer; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html"><i class="fas fa-lightbulb text-primary"></i> AskHere</a>
            <a href="index.html" class="btn btn-outline-light rounded-pill px-3 btn-sm fw-bold"><i class="fas fa-arrow-left me-2"></i> Back to Feed</a>
        </div>
    </nav>

    <div class="login-wrapper mt-4">
        <div class="card login-card border-0">
            <div class="row g-0">
                <div class="col-lg-6 d-none d-lg-block login-image">
                    <div class="login-overlay">
                        <h2 class="fw-bold mb-3" id="panelTitle">Join the Global Brain</h2>
                        <p class="fs-5 mb-4" id="panelDesc">Connect with millions exchanging knowledge daily.</p>
                    </div>
                </div>

                <div class="col-lg-6 bg-white p-5 position-relative">
                    
                    <!-- LOGIN FORM -->
                    <div id="loginForm">
                        <div class="text-center mb-4">
                            <i class="fas fa-user-astronaut fa-3x text-primary mb-3"></i>
                            <h3 class="fw-bold">Welcome Back</h3>
                        </div>
                        <div class="mb-3">
                            <input type="email" id="logEmail" class="form-control bg-light border-0 py-2" placeholder="Email Address" required>
                        </div>
                        <div class="mb-4">
                            <input type="password" id="logPass" class="form-control bg-light border-0 py-2" placeholder="Password" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-primary btn-lg rounded-pill fw-bold" onclick="loginUser()">Sign In</button>
                            <button type="button" class="btn btn-outline-dark btn-lg rounded-pill fw-bold mt-2" onclick="toggleForms()">Create New Account</button>
                        </div>
                    </div>

                    <!-- REGISTER FORM -->
                    <div id="registerForm" class="d-none">
                        <div class="text-center mb-4">
                            <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                            <h3 class="fw-bold">Create Account</h3>
                        </div>
                        <div class="mb-3">
                            <input type="email" id="regEmail" class="form-control bg-light border-0 py-2" placeholder="Email Address" required>
                        </div>
                        <div class="mb-4">
                            <input type="password" id="regPass" class="form-control bg-light border-0 py-2" placeholder="Password" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-primary btn-lg rounded-pill fw-bold" onclick="registerUser()">Sign Up</button>
                            <button type="button" class="btn btn-outline-dark btn-lg rounded-pill fw-bold mt-2" onclick="toggleForms()">I already have an account</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleForms() {
            document.getElementById('loginForm').classList.toggle('d-none');
            document.getElementById('registerForm').classList.toggle('d-none');
            document.getElementById('panelTitle').innerText = document.getElementById('loginForm').classList.contains('d-none') ? "Empower Your Mind" : "Join the Global Brain";
        }

        function loginUser() {
            const e = document.getElementById('logEmail').value;
            const p = document.getElementById('logPass').value;
            auth.signInWithEmailAndPassword(e, p)
                .then(() => window.location.href = "index.html")
                .catch(err => alert("Error: " + err.message));
        }

        function registerUser() {
            const e = document.getElementById('regEmail').value;
            const p = document.getElementById('regPass').value;
            auth.createUserWithEmailAndPassword(e, p)
                .then(() => window.location.href = "index.html")
                .catch(err => alert("Error: " + err.message));
        }
    </script>
</body>
</html>
